# SwiftLint Configuration for Yappy

disabled_rules: []
opt_in_rules: []

# Exclude generated output and one-off build utilities — not app code.
# NOTE: ".derivedData/" (dot-prefixed) is this repo's local build output and is a
# DIFFERENT path from Xcode's default "DerivedData/". Without it a local run
# reports thousands of violations in generated sources and buries the real ones
# (2,998 of 3,557 before this entry).
excluded:
  - DerivedData/
  - .derivedData/
  - .build-home/
  - dist/
  - Scripts/
  - "*.xcodeproj/"
  - Pods/
  - Carthage/Build/

# ─── Thresholds ──────────────────────────────────────────────────────────────
#
# The `error` levels below are a RATCHET, not a target. They are set just above
# the current worst offender so the build fails the moment anything grows
# FURTHER, while `warning` stays at the healthy value so the real signal is never
# lost. This is deliberate: AppDelegate is a large coordinator (3,088 lines, a
# 2,079-line class, a 401-line finishDictation) and decomposing it is a risky
# refactor with no user-visible benefit — but it should not be allowed to grow.
#
# These numbers are debt, recorded honestly. Lower them as files are split;
# never raise one without saying why.

line_length:
  warning: 120
  error: 500          # worst today: 478 (AskPromptPolicy prompt literals)
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 3100         # worst today: 3,088 (AppDelegate)

type_body_length:
  warning: 300
  error: 2100         # worst today: 2,079 (AppDelegate)

function_body_length:
  warning: 60
  error: 410          # worst today: 401 (finishDictation)

cyclomatic_complexity:
  warning: 10
  error: 45           # worst today: 41

large_tuple:
  warning: 3
  error: 7            # worst today: 6 (makeController() in
                      # VoiceEditCommandParserTests, whose call sites read
                      # `let (controller, _, transcriber, _, selection, _) = …`).
                      # This is the single best candidate for a real fix in this
                      # file — replace the tuple with a small named harness
                      # struct — and it stays a warning until someone does.

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 50
  excluded:
    - id
    - x
    - y
