name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData/Yappy-*
        key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-deriveddata-

    - name: Build
      run: xcodebuild -project Yappy.xcodeproj -scheme Yappy -configuration Debug build

    # The BLOCKING gate is the unit suite. UI tests are excluded here and run in
    # their own report-only step below.
    - name: Test (unit — blocking)
      run: |
        xcodebuild -project Yappy.xcodeproj -scheme Yappy \
          -destination 'platform=macOS' -skip-testing:YappyUITests test

    # UI smoke tests launch the app and drive its window, so they only belong on
    # a machine where nobody is at the keyboard — never on a dev Mac. They are
    # new and unproven on the runner image, so they start REPORT-ONLY (same
    # convention as the linters below): findings surface as annotations without
    # blocking a release. Promote to blocking once they have been stable for a
    # few runs.
    - name: Test (UI smoke — report-only)
      continue-on-error: true
      run: |
        xcodebuild -project Yappy.xcodeproj -scheme Yappy \
          -destination 'platform=macOS' -only-testing:YappyUITests test

    # Lint and format checks are BLOCKING as of the lint sweep: both tools exit 0
    # on the current tree, so any new violation is a real regression rather than
    # pre-existing noise. Do not add continue-on-error back — that is exactly how
    # the invalid .swiftformat config went unnoticed for months.
    #
    # SwiftLint's `error` thresholds are a debt ratchet set just above today's
    # worst offender (see .swiftlint.yml); warnings still surface the real signal
    # without failing the build.
    - name: Install linters
      # Tolerated: brew exits non-zero when a formula is already present on the
      # runner image. If a tool is genuinely missing, the step below fails loudly.
      continue-on-error: true
      run: brew install swiftlint swiftformat

    - name: SwiftLint (blocking)
      # Not --strict: that promotes warnings to errors, which would fail on the
      # ~300 known warnings the ratchet deliberately leaves visible.
      run: swiftlint lint --reporter github-actions-logging

    - name: SwiftFormat lint (blocking)
      run: swiftformat . --lint
